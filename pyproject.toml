[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-inference-orchestrator"
version = "0.1.0"
description = "Benchmark-backed adaptive scheduling for AI inference workloads"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
adaptive-inference = "adaptive_inference.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests", "comfyui/tests"]
